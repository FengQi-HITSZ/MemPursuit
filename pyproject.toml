[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mempursuit"
version = "0.1.0"
description = "MemPursuit: residual-guided evidence composition for long-term agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
fast = ["numba>=0.59,<1", "scipy>=1.10,<2"]
pipeline = [
  "openai>=1.50,<3", "pydantic>=2.10,<3", "qdrant-client>=1.15,<2",
  "fastembed>=0.7,<1", "spacy>=3.7,<4", "tiktoken>=0.7,<1",
  "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "aiohttp>=3.9,<4",
  "aiolimiter>=1.1,<2", "tqdm>=4.66,<5", "requests>=2.31,<3",
  "scipy>=1.10,<2", "datasets>=3,<5", "pyarrow>=17,<24",
]
local-embeddings = ["sentence-transformers>=5,<6"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "pytest-mock>=3,<4", "ruff>=0.9,<1"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["mempursuit*", "mem0*", "benchmarks*", "server*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
